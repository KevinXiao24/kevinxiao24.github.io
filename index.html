<!DOCTYPE html>
<!-- git 主页分支：copy 自 icu 主页，三卡横向平铺；血压为免登录工具；已移除第四张卡片 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kevin Xiao · 个人空间</title>
<style>
  :root{
    --bg:#121417;
    --bg2:#0d0f12;
    --card:#1a1e25;
    --card-h:#22272f;
    --line:#2b313b;
    --ink:#f2f4f7;
    --sub:#8d97a5;
    --accent:#ff7a18;
    --accent-d:#e0630a;
    --accent-soft:rgba(255,122,24,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-text-size-adjust:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:60px 20px 44px;
    background-image:
      radial-gradient(ellipse 70% 45% at 12% 0%, rgba(255,122,24,.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 92% 6%, rgba(255,122,24,.06), transparent 60%),
      linear-gradient(180deg,#131619 0%,#0d0f12 100%);
    background-attachment:fixed;
  }
  .wrap{width:100%;max-width:720px}

  /* ---- 顶部 ---- */
  header{text-align:center;margin-bottom:46px}
  .avatar{
    width:78px;height:78px;border-radius:50%;margin:0 auto 18px;
    background:linear-gradient(140deg,#ff8c33,#e0630a);
    display:flex;align-items:center;justify-content:center;
    color:#1a1005;font-size:31px;font-weight:800;letter-spacing:-1px;
    box-shadow:0 10px 30px rgba(255,122,24,.32);
  }
  h1{font-size:27px;margin:0 0 8px;letter-spacing:.5px;font-weight:700}
  .tagline{color:var(--sub);font-size:13.5px;margin:0}
  .rule{
    width:52px;height:2px;margin:20px auto 0;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
  }

  /* ---- 卡片：三张横向平铺 ---- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:620px){ .grid{grid-template-columns:1fr} }

  a.card{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;
    transition:transform .2s ease, box-shadow .2s ease,
               border-color .2s ease, background .2s ease;
    position:relative;overflow:hidden;
  }
  a.card::after{
    content:"";position:absolute;inset:0;border-radius:16px;
    background:linear-gradient(135deg,rgba(255,122,24,.10),transparent 55%);
    opacity:0;transition:opacity .2s ease;
  }
  a.card:hover{
    transform:translateY(-4px);
    background:var(--card-h);
    border-color:rgba(255,122,24,.55);
    box-shadow:0 14px 32px rgba(0,0,0,.45);
  }
  a.card:hover::after{opacity:1}
  a.card:active{transform:translateY(-1px)}

  .icon{
    width:44px;height:44px;border-radius:12px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:var(--accent-soft);
    border:1px solid rgba(255,122,24,.22);
  }
  .icon.plain{
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
  }

  .card h2{
    font-size:16px;margin:0 0 6px;font-weight:600;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  /* 让三张卡片等高：血压卡片是两行说明 */
  .card p{font-size:12.5px;color:var(--sub);margin:0;min-height:3.2em}

  .badge{
    font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:5px;
    background:rgba(255,122,24,.16);color:#ffa257;
    border:1px solid rgba(255,122,24,.28);
    letter-spacing:.2px;
  }

  .arrow{
    position:absolute;right:18px;top:50%;transform:translateY(-50%);
    color:var(--accent);font-size:18px;opacity:0;transition:opacity .2s ease, right .2s ease;
  }
  a.card:hover .arrow{opacity:1;right:14px}

  footer{
    margin-top:46px;text-align:center;font-size:12px;color:#5d6674;line-height:1.9;
  }
  footer a{color:#78818f;text-decoration:none;border-bottom:1px solid #2b313b}
  footer a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar">K</div>
    <h1>Kevin Xiao</h1>
    <p class="tagline">个人空间 · 自用工具集</p>
    <div class="rule"></div>
  </header>

  <div class="grid">
    <a class="card" id="bpCard" href="bp/">
      <div class="icon">🩺</div>
      <h2>血压管理</h2>
      <p>记录、分级预警、趋势分析<br>免登录工具 · 数据只存自己浏览器</p>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="roadbook/">
      <div class="icon">🗺️</div>
      <h2>路书</h2>
      <p>K 的自驾之旅</p>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="https://github.com/KevinXiao24" target="_blank" rel="noopener">
      <div class="icon plain">💻</div>
      <h2>GitHub</h2>
      <p>@KevinXiao24 · 代码与项目</p>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>
    <div>© <span id="year"></span> Kevin Xiao</div>
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // git 主页版：血压是纯前端工具，入口固定为同站 bp/（免安装单文件版）。
  // GitHub Pages 没有 Python 后端，不做 /api/status 探测，
  // 也不能回退到独立端口 —— Pages 不支持端口，那样必然失败。
  // 每位访客的数据只存在自己的浏览器里，互不共享、不上传服务器。

  // 兼容兜底：服务器路书目录会把本仓库整包同步过去。若它的 nginx 还指向
  // 仓库根，访问 /roadbook/ 会加载本页 —— 此时自动转到子目录里的路书门户，
  // 避免路书入口失效。github.io 站点本身不触发（改好 nginx 后也不会触发）。
  if (location.pathname.indexOf('/roadbook/') === 0 &&
      location.hostname.indexOf('github.io') < 0) {
    location.replace('roadbook/index.html');
  }
</script>
</body>
</html>
